
name: Build BarTrade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract BarTrade project
        run: unzip -q BarTrade_Pregled_Zaliha_APK_BUILD.zip -d .

      - name: Build APK
        working-directory: bartrade_app/android
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BarTrade-APK
          path: bartrade_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
